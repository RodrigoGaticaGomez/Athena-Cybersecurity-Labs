    <path d="M1600 95h-210l-35 35h-90"/><circle cx="1390" cy="95" r="4" fill="#00a8ff"/>
    <path d="M1600 410h-250l-45-45h-100"/><circle cx="1350" cy="410" r="4" fill="#00a8ff"/>
  </g>
