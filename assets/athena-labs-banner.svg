  <text x="510" y="278" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" letter-spacing="12" fill="#56bdff" filter="url(#glow)">CYBERSECURITY LABS</text>
  <line x1="510" y1="310" x2="1460" y2="310" stroke="#188cc8" stroke-width="3"/>
